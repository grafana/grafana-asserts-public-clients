openapi: 3.1.0
info:
  contact:
    email: support@asserts.ai
    name: Support
    url: https://www.grafana.com
  description: Asserts Public API
  termsOfService: https://www.asserts.ai/terms-of-service
  title: "Asserts, Inc"
  version: v2.38.0
servers:
- description: Generated server url
  url: http://localhost:8030
tags:
- description: Serve stored cluster-scoped system schemas
  name: System KgSchema API
paths:
  /apis/kg.grafana.com/v1alpha1/systemschemas:
    get:
      description: Returns a wrapped list of domain/version/displayName refs for all
        stored system schemas.
      operationId: list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemKgSchemaRefListDto'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/SystemKgSchemaRefListDto'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/SystemKgSchemaRefListDto'
          description: List of schema references
      summary: List all system schema references
      tags:
      - System KgSchema API
  /apis/kg.grafana.com/v1alpha1/systemschemas/{domain}/{version}:
    get:
      description: Returns the full schema bundle stored for the given domain/version
        key.
      operationId: get
      parameters:
      - explode: false
        in: path
        name: domain
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: version
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemKgSchemaBundleDto'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/SystemKgSchemaBundleDto'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/SystemKgSchemaBundleDto'
          description: Schema bundle found
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No schema found for the given domain/version
      summary: Get a system schema bundle by domain and version
      tags:
      - System KgSchema API
components:
  parameters: {}
  schemas:
    SchemaDomainDto:
      example:
        displayName: displayName
        name: name
        version: version
      properties:
        name:
          minLength: 1
          pattern: "^[a-z][a-z0-9]*$"
          type: string
        displayName:
          type: string
        version:
          minLength: 1
          pattern: "^v(?<major>[0-9]+)(?:(?<pre>alpha|beta)(?<preNum>[0-9]+))?$"
          type: string
      required:
      - name
      - version
    SystemKgSchemaRefListDto:
      example:
        schemas:
        - displayName: displayName
          name: name
          version: version
        - displayName: displayName
          name: name
          version: version
      properties:
        schemas:
          items:
            $ref: '#/components/schemas/SchemaDomainDto'
          type: array
    ApiError:
      example:
        trace_id: trace_id
        code: KG_NOT_PROVISIONED
        span_id: span_id
        requestId: requestId
        debugMessage: debugMessage
        message: message
        status: NOT_FOUND
        timestamp: 1
        subErrors:
        - message: message
        - message: message
      properties:
        status:
          description: "HTTP status, e.g. NOT_FOUND"
          example: NOT_FOUND
          type: string
        requestId:
          type: string
        timestamp:
          format: int64
          type: integer
        message:
          type: string
        debugMessage:
          type: string
        subErrors:
          items:
            $ref: '#/components/schemas/ApiError_subErrors_inner'
          type: array
        code:
          description: "Stable machine-readable error code, present only for errors\
            \ that define one"
          example: KG_NOT_PROVISIONED
          type: string
        trace_id:
          type: string
        span_id:
          type: string
    ApiQuerySyntaxError:
      allOf:
      - $ref: '#/components/schemas/ApiSubError'
