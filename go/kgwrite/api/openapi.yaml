openapi: 3.1.0
info:
  contact:
    email: support@asserts.ai
    name: Support
    url: https://www.grafana.com
  description: Asserts Public API
  termsOfService: https://www.asserts.ai/terms-of-service
  title: "Asserts, Inc"
  version: 2.105.3
servers:
- description: Generated server url
  url: http://localhost:8030
tags:
- description: Read Knowledge Graph entities by stable identity (type + name + scope)
  name: Knowledge Graph Read API
- description: Write custom (API-origin) entities and relationships into the Knowledge
    Graph
  name: Knowledge Graph Write API
- description: Discover the effective declared schemas for a tenant
  name: Knowledge Graph Schema API
paths:
  /apis/kg.grafana.com/v1alpha1/namespaces/{namespace}/relationships:
    delete:
      description: "Deletes an API-origin edge between the from/to entities. The relationship\
        \ coordinates travel as query params (no request body): type, plus from.domain/from.type/from.name\
        \ (+ from.scope[key]=value) and the matching to.* params. Putting type in\
        \ the query string matches the entity DELETE shape on the collection path."
      operationId: deleteRelationship
      parameters:
      - description: "Tenant namespace, formatted as stacks-<stackId>"
        explode: false
        in: path
        name: namespace
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: type
        required: true
        schema:
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
          type: string
        style: form
      - explode: true
        in: query
        name: from.domain
        required: true
        schema:
          minLength: 1
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
          type: string
        style: form
      - explode: true
        in: query
        name: from.type
        required: true
        schema:
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
          type: string
        style: form
      - explode: true
        in: query
        name: from.name
        required: true
        schema:
          minLength: 1
          type: string
        style: form
      - explode: true
        in: query
        name: to.domain
        required: true
        schema:
          minLength: 1
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
          type: string
        style: form
      - explode: true
        in: query
        name: to.type
        required: true
        schema:
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
          type: string
        style: form
      - explode: true
        in: query
        name: to.name
        required: true
        schema:
          minLength: 1
          type: string
        style: form
      - description: "Optional scope key/value pairs identifying the 'from' entity\
          \ (from.scope[key]=value)."
        explode: true
        in: query
        name: from.scope
        required: false
        schema:
          additionalProperties:
            type: string
        style: deepObject
      - description: "Optional scope key/value pairs identifying the 'to' entity (to.scope[key]=value)."
        explode: true
        in: query
        name: to.scope
        required: false
        schema:
          additionalProperties:
            type: string
        style: deepObject
      - $ref: '#/components/parameters/TenantId'
      responses:
        "204":
          description: Relationship deleted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing tenant context or malformed namespace
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: "Tenant write flag is disabled, namespace does not match the\
            \ request tenant, or edge is not API-origin"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Relationship not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Graph writes are paused for a graph migration
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Query params failed validation
      summary: Delete a custom relationship
      tags:
      - Knowledge Graph Write API
    post:
      description: Upserts an API-origin edge between two existing entities; both
        endpoints must already exist.
      operationId: upsertRelationship
      parameters:
      - description: "Tenant namespace, formatted as stacks-<stackId>"
        explode: false
        in: path
        name: namespace
        required: true
        schema:
          type: string
        style: simple
      - description: "Permit undeclared types, properties and scope keys. Declared\
          \ constraints still apply."
        explode: true
        in: query
        name: allowUndeclared
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipWriteRequestDto'
          application/x-yml:
            schema:
              $ref: '#/components/schemas/RelationshipWriteRequestDto'
          application/x-yaml:
            schema:
              $ref: '#/components/schemas/RelationshipWriteRequestDto'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipWriteResponseDto'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/RelationshipWriteResponseDto'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/RelationshipWriteResponseDto'
          description: Relationship written
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing tenant context or malformed namespace
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: "Tenant write flag is disabled, namespace does not match the\
            \ request tenant"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: from or to entity not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: "Edge already exists with a non-API origin, or graph writes\
            \ are paused for a graph migration"
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request body failed validation
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Schema lookup unavailable; retry the request
      summary: Create or update a custom relationship
      tags:
      - Knowledge Graph Write API
  /apis/kg.grafana.com/v1alpha1/namespaces/{namespace}/graph:
    post:
      description: "Upserts the request's entities first, then its relationships,\
        \ as ONE atomic write: the entity and relationship data all commit together\
        \ or not at all, and the server never splits a request internally. (Auto-registering\
        \ a not-yet-seen entity type and its indexes runs before that atomic write\
        \ and is idempotent, so it may persist even if the write then fails — retrying\
        \ is safe.) A request may contain at most kg-write.batch.max-items total items\
        \ (default 500); callers with larger loads send multiple requests, each independently\
        \ atomic, and the upserts are idempotent so retrying a failed request is safe.\
        \ No stub entities are created for unresolved relationship endpoints. The\
        \ returned counts are the accepted (submitted) item counts, not a created-vs-updated\
        \ breakdown."
      operationId: writeGraph
      parameters:
      - description: "Tenant namespace, formatted as stacks-<stackId>"
        explode: false
        in: path
        name: namespace
        required: true
        schema:
          type: string
        style: simple
      - description: "Permit undeclared types, properties and scope keys for the whole\
          \ batch. Declared constraints still apply."
        explode: true
        in: query
        name: allowUndeclared
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphWriteRequestDto'
          application/x-yml:
            schema:
              $ref: '#/components/schemas/GraphWriteRequestDto'
          application/x-yaml:
            schema:
              $ref: '#/components/schemas/GraphWriteRequestDto'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphWriteResponseDto'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/GraphWriteResponseDto'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/GraphWriteResponseDto'
          description: Batch written atomically
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing tenant context or malformed namespace
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: "Tenant write flag is disabled, namespace does not match the\
            \ request tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: "Entity or relationship ownership conflict (an entity identity\
            \ exists in the telemetry domain, or a target entity or relationship is\
            \ not API-owned), or graph writes are paused for a graph migration — nothing\
            \ written"
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: "Validation failure (empty batch, bean validation, over-size\
            \ batch, non-writable domain, duplicate entity identity, or unresolved\
            \ relationship endpoint) — nothing written"
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Schema lookup unavailable; retry the request
      summary: Write a batch of custom entities and relationships
      tags:
      - Knowledge Graph Write API
  /apis/kg.grafana.com/v1alpha1/namespaces/{namespace}/entities:
    delete:
      description: "Deletes an API-origin entity; only _origin=api objects may be\
        \ deleted. The entity coordinates travel as query params (no request body):\
        \ domain, type, and name, plus an optional nested scope map (scope[key]=value).\
        \ Putting name in the query string (not the path) allows names that contain\
        \ '/'."
      operationId: deleteEntity
      parameters:
      - description: "Tenant namespace, formatted as stacks-<stackId>"
        explode: false
        in: path
        name: namespace
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: domain
        required: true
        schema:
          minLength: 1
          pattern: "^(?!kg$)(?!metrics$)[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
          type: string
        style: form
      - explode: true
        in: query
        name: type
        required: true
        schema:
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
          type: string
        style: form
      - explode: true
        in: query
        name: name
        required: true
        schema:
          minLength: 1
          type: string
        style: form
      - description: "Optional scope key/value pairs identifying the entity (scope[key]=value)."
        explode: true
        in: query
        name: scope
        required: false
        schema:
          additionalProperties:
            type: string
        style: deepObject
      - $ref: '#/components/parameters/TenantId'
      responses:
        "204":
          description: Entity deleted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: "Missing tenant context, malformed namespace, or invalid type/scope\
            \ key"
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: "Tenant write flag is disabled, namespace does not match the\
            \ request tenant, or target is not API-origin"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Entity not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Graph writes are paused for a graph migration
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Query params failed validation
      summary: Delete a custom entity
      tags:
      - Knowledge Graph Write API
    get:
      description: "Resolves a single entity by domain + type + name + exact scope\
        \ (scope[key]=value query params). The scope must be the entity's complete\
        \ scope; a subset of its scope keys does not match. Omit scope for scope-less\
        \ entities and domain for the default telemetry domain."
      operationId: lookupEntity
      parameters:
      - description: "Tenant namespace, formatted as stacks-<stackId>"
        explode: false
        in: path
        name: namespace
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: type
        required: true
        schema:
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
          type: string
        style: form
      - explode: true
        in: query
        name: name
        required: true
        schema:
          minLength: 1
          type: string
        style: form
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
          type: string
        style: form
      - description: "Optional scope key/value pairs identifying the entity (scope[key]=value)."
        explode: true
        in: query
        name: scope
        required: false
        schema:
          additionalProperties:
            type: string
        style: deepObject
      - $ref: '#/components/parameters/TenantId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityReadResponseDto'
          description: Entity details
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing tenant context or malformed namespace
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Namespace does not match the request tenant
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No entity with the given identity
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Identity params failed validation
      summary: Get one entity by its identity
      tags:
      - Knowledge Graph Read API
    post:
      description: "Upserts an API-origin entity identified by (type, name, scope):\
        \ 201 on create, 200 on update."
      operationId: upsertEntity
      parameters:
      - description: "Tenant namespace, formatted as stacks-<stackId>; must match\
          \ the request tenant"
        explode: false
        in: path
        name: namespace
        required: true
        schema:
          type: string
        style: simple
      - description: "Permit undeclared types, properties and scope keys. Declared\
          \ constraints still apply."
        explode: true
        in: query
        name: allowUndeclared
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityWriteRequestDto'
          application/x-yml:
            schema:
              $ref: '#/components/schemas/EntityWriteRequestDto'
          application/x-yaml:
            schema:
              $ref: '#/components/schemas/EntityWriteRequestDto'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityWriteResponseDto'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/EntityWriteResponseDto'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/EntityWriteResponseDto'
          description: Entity created
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityWriteResponseDto'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/EntityWriteResponseDto'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/EntityWriteResponseDto'
          description: Entity updated
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing tenant context or malformed namespace
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: "Tenant write flag is disabled, namespace does not match the\
            \ request tenant"
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: "Target already exists with a non-API origin, or graph writes\
            \ are paused for a graph migration"
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request body failed validation (including an invalid entity
            type)
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yml:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Schema lookup unavailable; retry the request
      summary: Create or update a custom entity
      tags:
      - Knowledge Graph Write API
  /apis/kg.grafana.com/v1alpha1/namespaces/{namespace}/schemas:
    get:
      description: "Returns installed system schemas for the authorized tenant namespace.\
        \ By default, each domain includes only its highest-priority version and bundle\
        \ details are omitted."
      operationId: listSchemas
      parameters:
      - description: "Tenant namespace, formatted as stacks-<stackId>"
        explode: false
        in: path
        name: namespace
        required: true
        schema:
          type: string
        style: simple
      - description: Include complete schema bundle contents
        explode: true
        in: query
        name: expand
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Return only the highest-priority version of each domain
        explode: true
        in: query
        name: latest_only
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - $ref: '#/components/parameters/TenantId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KgSchemaListDto'
          description: Schema collection
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: "Missing tenant context, malformed namespace, or invalid query\
            \ parameter"
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Namespace does not match the request tenant
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Schema store read failed
      summary: List effective declared schemas
      tags:
      - Knowledge Graph Schema API
  /apis/kg.grafana.com/v1alpha1/namespaces/{namespace}/entities/connected:
    get:
      description: "Lists entities with at least one relationship to the anchor entity\
        \ addressed by domain + type + name + exact scope; optionally filtered to\
        \ one connected entity type. Expired connections are included with active:\
        \ false. Results are ordered by name, with identity tiebreakers (type, domain,\
        \ scope) for stable pagination."
      operationId: lookupConnectedEntities
      parameters:
      - description: "Tenant namespace, formatted as stacks-<stackId>"
        explode: false
        in: path
        name: namespace
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: type
        required: true
        schema:
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
          type: string
        style: form
      - explode: true
        in: query
        name: name
        required: true
        schema:
          minLength: 1
          type: string
        style: form
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
          type: string
        style: form
      - description: Restrict results to connected entities of this type
        explode: true
        in: query
        name: connected_type
        required: false
        schema:
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
