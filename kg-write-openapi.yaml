openapi: 3.1.0
info:
  title: "Asserts, Inc"
  description: Asserts Public API
  termsOfService: https://www.asserts.ai/terms-of-service
  contact:
    name: Support
    url: "https://www.grafana.com"
    email: support@asserts.ai
  version: 2026.08.13-141456
servers:
- url: http://localhost:8030
  description: Generated server url
tags:
- name: Knowledge Graph Read API
  description: Read Knowledge Graph entities by stable identity (type + name + scope)
- name: Knowledge Graph Write API
  description: Write custom (API-origin) entities and relationships into the Knowledge
    Graph
paths:
  /apis/kg.grafana.com/v1alpha1/namespaces/{namespace}/relationships:
    post:
      tags:
      - Knowledge Graph Write API
      summary: Create or update a custom relationship
      description: Upserts an API-origin edge between two existing entities; both
        endpoints must already exist.
      operationId: upsertRelationship
      parameters:
      - name: namespace
        in: path
        description: "Tenant namespace, formatted as stacks-<stackId>"
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/TenantId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipWriteRequestDto"
          application/x-yml:
            schema:
              $ref: "#/components/schemas/RelationshipWriteRequestDto"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/RelationshipWriteRequestDto"
        required: true
      responses:
        "200":
          description: Relationship written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipWriteResponseDto"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/RelationshipWriteResponseDto"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/RelationshipWriteResponseDto"
        "400":
          description: Missing tenant context or malformed namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Namespace does not match the request tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: from or to entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Edge already exists with a non-API origin, or graph writes\
            \ are paused for a graph migration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Knowledge Graph Write API
      summary: Delete a custom relationship
      description: "Deletes an API-origin edge between the from/to entities. The relationship\
        \ coordinates travel as query params (no request body): type, plus from.domain/from.type/from.name\
        \ (+ from.scope[key]=value) and the matching to.* params. Putting type in\
        \ the query string matches the entity DELETE shape on the collection path."
      operationId: deleteRelationship
      parameters:
      - name: namespace
        in: path
        description: "Tenant namespace, formatted as stacks-<stackId>"
        required: true
        schema:
          type: string
      - name: type
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
      - name: from.domain
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      - name: from.type
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
      - name: from.name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: to.domain
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      - name: to.type
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
      - name: to.name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: from.scope
        in: query
        description: "Optional scope key/value pairs identifying the 'from' entity\
          \ (from.scope[key]=value)."
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties:
            type: string
      - name: to.scope
        in: query
        description: "Optional scope key/value pairs identifying the 'to' entity (to.scope[key]=value)."
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties:
            type: string
      - $ref: "#/components/parameters/TenantId"
      responses:
        "204":
          description: Relationship deleted
        "400":
          description: Missing tenant context or malformed namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Namespace does not match the request tenant, or edge is not\
            \ API-origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Relationship not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Graph writes are paused for a graph migration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Query params failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apis/kg.grafana.com/v1alpha1/namespaces/{namespace}/graph:
    post:
      tags:
      - Knowledge Graph Write API
      summary: Write a batch of custom entities and relationships
      description: "Upserts the request's entities first, then its relationships,\
        \ as ONE atomic write: the entity and relationship data all commit together\
        \ or not at all, and the server never splits a request internally. (Auto-registering\
        \ a not-yet-seen entity type and its indexes runs before that atomic write\
        \ and is idempotent, so it may persist even if the write then fails — retrying\
        \ is safe.) A request may contain at most kg-write.batch.max-items total items\
        \ (default 500); callers with larger loads send multiple requests, each independently\
        \ atomic, and the upserts are idempotent so retrying a failed request is safe.\
        \ No stub entities are created for unresolved relationship endpoints. The\
        \ returned counts are the accepted (submitted) item counts, not a created-vs-updated\
        \ breakdown."
      operationId: writeGraph
      parameters:
      - name: namespace
        in: path
        description: "Tenant namespace, formatted as stacks-<stackId>"
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/TenantId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphWriteRequestDto"
          application/x-yml:
            schema:
              $ref: "#/components/schemas/GraphWriteRequestDto"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/GraphWriteRequestDto"
        required: true
      responses:
        "200":
          description: Batch written atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphWriteResponseDto"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/GraphWriteResponseDto"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/GraphWriteResponseDto"
        "400":
          description: Missing tenant context or malformed namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Namespace does not match the request tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Default-domain shadow conflict (an entity with this identity\
            \ already exists in the telemetry domain), or graph writes are paused\
            \ for a graph migration — nothing written"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "Validation failure (empty batch, bean validation, over-size\
            \ batch, non-writable domain, duplicate entity identity, or unresolved\
            \ relationship endpoint) — nothing written"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apis/kg.grafana.com/v1alpha1/namespaces/{namespace}/entities:
    get:
      tags:
      - Knowledge Graph Read API
      summary: Get one entity by its identity
      description: "Resolves a single entity by domain + type + name + exact scope\
        \ (scope[key]=value query params). The scope must be the entity's complete\
        \ scope; a subset of its scope keys does not match. Omit scope for scope-less\
        \ entities and domain for the default telemetry domain (kg)."
      operationId: lookupEntity
      parameters:
      - name: namespace
        in: path
        description: "Tenant namespace, formatted as stacks-<stackId>"
        required: true
        schema:
          type: string
      - name: type
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
      - name: name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: domain
        in: query
        required: false
        schema:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      - name: scope
        in: query
        description: "Optional scope key/value pairs identifying the entity (scope[key]=value)."
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties:
            type: string
      - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Entity details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityReadResponseDto"
        "400":
          description: Missing tenant context or malformed namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Namespace does not match the request tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No entity with the given identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Identity params failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Knowledge Graph Write API
      summary: Create or update a custom entity
      description: "Upserts an API-origin entity identified by (type, name, scope):\
        \ 201 on create, 200 on update."
      operationId: upsertEntity
      parameters:
      - name: namespace
        in: path
        description: "Tenant namespace, formatted as stacks-<stackId>; must match\
          \ the request tenant"
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/TenantId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityWriteRequestDto"
          application/x-yml:
            schema:
              $ref: "#/components/schemas/EntityWriteRequestDto"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/EntityWriteRequestDto"
        required: true
      responses:
        "201":
          description: Entity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityWriteResponseDto"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/EntityWriteResponseDto"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/EntityWriteResponseDto"
        "200":
          description: Entity updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityWriteResponseDto"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/EntityWriteResponseDto"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/EntityWriteResponseDto"
        "400":
          description: Missing tenant context or malformed namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Namespace does not match the request tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Target already exists with a non-API origin, or graph writes\
            \ are paused for a graph migration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Request body failed validation (including an invalid entity
            type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Knowledge Graph Write API
      summary: Delete a custom entity
      description: "Deletes an API-origin entity; only _origin=api objects may be\
        \ deleted. The entity coordinates travel as query params (no request body):\
        \ domain, type, and name, plus an optional nested scope map (scope[key]=value).\
        \ Putting name in the query string (not the path) allows names that contain\
        \ '/'."
      operationId: deleteEntity
      parameters:
      - name: namespace
        in: path
        description: "Tenant namespace, formatted as stacks-<stackId>"
        required: true
        schema:
          type: string
      - name: domain
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: "^(?!kg$)[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      - name: type
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
      - name: name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: scope
        in: query
        description: "Optional scope key/value pairs identifying the entity (scope[key]=value)."
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties:
            type: string
      - $ref: "#/components/parameters/TenantId"
      responses:
        "204":
          description: Entity deleted
        "400":
          description: "Missing tenant context, malformed namespace, or invalid type/scope\
            \ key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Namespace does not match the request tenant, or target is\
            \ not API-origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Graph writes are paused for a graph migration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Query params failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yml:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apis/kg.grafana.com/v1alpha1/namespaces/{namespace}/entities/connected:
    get:
      tags:
      - Knowledge Graph Read API
      summary: Get entities connected to the entity with the given identity
      description: "Lists entities with at least one relationship to the anchor entity\
        \ addressed by domain + type + name + exact scope; optionally filtered to\
        \ one connected entity type. Expired connections are included with active:\
        \ false. Results are ordered by name, with identity tiebreakers (type, domain,\
        \ scope) for stable pagination."
      operationId: lookupConnectedEntities
      parameters:
      - name: namespace
        in: path
        description: "Tenant namespace, formatted as stacks-<stackId>"
        required: true
        schema:
          type: string
      - name: type
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
      - name: name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: domain
        in: query
        required: false
        schema:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      - name: connected_type
        in: query
        description: Restrict results to connected entities of this type
        required: false
        schema:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 100
          minimum: 1
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: scope
        in: query
        description: "Exact scope key/value pairs identifying the anchor entity (scope[key]=value)."
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties:
            type: string
      - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Connected entities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedEntitiesResponseDto"
        "400":
          description: Missing tenant context or malformed namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Namespace does not match the request tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No entity with the given identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Identity params failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    EntityRefDto:
      type: object
      properties:
        domain:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        type:
          type: string
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        name:
          type: string
          minLength: 1
        scope:
          type: object
          additionalProperties:
            type: string
      required:
      - domain
      - name
      - type
    RelationshipWriteRequestDto:
      type: object
      properties:
        domain:
          type: string
          minLength: 1
          pattern: "^(?!kg$)[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        type:
          type: string
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        from:
          $ref: "#/components/schemas/EntityRefDto"
        to:
          $ref: "#/components/schemas/EntityRefDto"
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/KgPropertyValue"
          description: "Custom properties to store on the relationship. Values must\
            \ be scalars (string, boolean, or number) or arrays of scalars; nested\
            \ objects, nested arrays, and null values are rejected. Integral numbers\
            \ are stored as 64-bit signed integers and floating-point numbers as IEEE-754\
            \ doubles."
        ttlSeconds:
          type: integer
          format: int64
          description: "Time-to-live in seconds. Positive values expire the relationship\
            \ after that many seconds, 0 expires it immediately, and negative values\
            \ mean no expiry."
          example: -1
      required:
      - domain
      - from
      - to
      - ttlSeconds
      - type
    ApiError:
      type: object
      properties:
        status:
          type: string
          description: "HTTP status, e.g. NOT_FOUND"
          example: NOT_FOUND
        requestId:
          type: string
        timestamp:
          type: integer
          format: int64
        message:
          type: string
        debugMessage:
          type: string
        subErrors:
          type: array
          items:
            oneOf:
            - $ref: "#/components/schemas/ApiSubError"
            - $ref: "#/components/schemas/ApiQuerySyntaxError"
            - $ref: "#/components/schemas/ApiValidationError"
        code:
          type: string
          description: "Stable machine-readable error code, present only for errors\
            \ that define one"
          example: KG_NOT_PROVISIONED
        trace_id:
          type: string
        span_id:
          type: string
    ApiQuerySyntaxError:
      allOf:
      - $ref: "#/components/schemas/ApiSubError"
      - type: object
        properties:
          line:
            type: integer
            format: int32
          column:
            type: integer
            format: int32
    ApiSubError:
      type: object
      properties:
        message:
          type: string
    ApiValidationError:
      allOf:
      - $ref: "#/components/schemas/ApiSubError"
      - type: object
        properties:
          field:
            type: string
          rejectedValue: {}
    RelationshipWriteResponseDto:
      type: object
      properties:
        domain:
          type: string
        type:
          type: string
        from:
          $ref: "#/components/schemas/EntityRefDto"
        to:
          $ref: "#/components/schemas/EntityRefDto"
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/KgPropertyValue"
          description: "Properties stored on the relationship: scalar values (string,\
            \ boolean, int64, or double) or arrays of scalars."
    EntityWriteRequestDto:
      type: object
      properties:
        domain:
          type: string
          minLength: 1
          pattern: "^(?!kg$)[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        type:
          type: string
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        name:
          type: string
          minLength: 1
        scope:
          type: object
          additionalProperties:
            type: string
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/KgPropertyValue"
          description: "Custom properties to store on the entity. Values must be scalars\
            \ (string, boolean, or number) or arrays of scalars; nested objects, nested\
            \ arrays, and null values are rejected. Integral numbers are stored as\
            \ 64-bit signed integers and floating-point numbers as IEEE-754 doubles."
        ttlSeconds:
          type: integer
          format: int64
          description: "Time-to-live in seconds. Positive values expire the entity\
            \ after that many seconds, 0 expires it immediately, and negative values\
            \ mean no expiry."
          example: -1
      required:
      - domain
      - name
      - ttlSeconds
      - type
    GraphWriteRequestDto:
      type: object
      description: Batch of entities and relationships to upsert atomically. At least
        one of `entities` or `relationships` must be non-empty; an empty request is
        a 422.
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/EntityWriteRequestDto"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/RelationshipWriteRequestDto"
    GraphWriteResponseDto:
      type: object
      properties:
        entitiesWritten:
          type: integer
          format: int64
          description: "Count of entities in the accepted batch (idempotent upsert\
            \ count, not a created-vs-updated breakdown)."
        relationshipsWritten:
          type: integer
          format: int64
          description: "Count of relationships in the accepted batch (idempotent upsert\
            \ count, not a created-vs-updated breakdown)."
    EntityWriteResponseDto:
      type: object
      properties:
        domain:
          type: string
        type:
          type: string
        name:
          type: string
        scope:
          type: object
          additionalProperties:
            type: string
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/KgPropertyValue"
          description: "Properties stored on the entity: scalar values (string, boolean,\
            \ int64, or double) or arrays of scalars."
    EntityReadResponseDto:
      type: object
      properties:
        domain:
          type: string
        type:
          type: string
        name:
          type: string
        scope:
          type: object
          additionalProperties:
            type: string
        active:
          type: boolean
          default: false
          description: Whether the entity is currently active (not expired).
        properties:
          type: object
          additionalProperties: {}
          description: "Properties stored on the entity: scalar values (string, boolean,\
            \ int64, or double) or arrays of scalars."
        connectedTypes:
          type: array
          description: Entity types this entity has at least one relationship to;
            useful for building follow-up /entities/connected queries.
          items:
            type: string
    ConnectedEntitiesResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntityReadResponseDto"
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
    KgPropertyScalar:
      description: "A scalar property value. Integral numbers are stored as 64-bit\
        \ signed integers and floating-point numbers as IEEE-754 doubles; NaN, Infinity,\
        \ and integers overflowing 64 bits are rejected."
      oneOf:
      - type: string
      - type: boolean
      - type: number
        format: double
    KgPropertyValue:
      description: "A property value: a scalar, or a (possibly mixed) array of scalars.\
        \ Nested objects, nested arrays, and null values are rejected."
      oneOf:
      - type: string
      - type: boolean
      - type: number
        format: double
      - type: array
        items:
          $ref: "#/components/schemas/KgPropertyScalar"
  parameters:
    TenantId:
      name: X-Scope-OrgID
      in: header
      description: Grafana Tenant/Stack ID
      schema:
        type: string
      example: "2944"
