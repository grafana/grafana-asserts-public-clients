name: Generate Clients

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Check out the branch tip (not the PR merge ref) so the signed commit
          # step can use HEAD as expectedHeadOid for createCommitOnBranch.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # Generation only — committing is done once, signed, in the step below.
      - name: Generate Client
        uses: grafana/shared-workflows/actions/generate-openapi-clients@8ef55db5803bf7fc92e32ca4a4f488657f3f53fe #v1.1.0
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          package-name: gcom
          spec-path: openapi.yaml
          modify-spec-script: .github/workflows/modify-spec.sh
          commit-changes: "false"

      - name: Generate KG Write Client
        uses: grafana/shared-workflows/actions/generate-openapi-clients@8ef55db5803bf7fc92e32ca4a4f488657f3f53fe #v1.1.0
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          package-name: kgwrite
          spec-path: kg-write-openapi.yaml
          modify-spec-script: .github/workflows/modify-spec.sh
          commit-changes: "false"

      - name: Generate System Schema Client
        uses: grafana/shared-workflows/actions/generate-openapi-clients@8ef55db5803bf7fc92e32ca4a4f488657f3f53fe #v1.1.0
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          package-name: systemschema
          spec-path: system-schema-openapi.yaml
          modify-spec-script: .github/workflows/modify-spec.sh
          commit-changes: "false"

      - name: Generate JavaScript Client
        uses: grafana/shared-workflows/actions/generate-openapi-clients@f3f00a8f0a28e0cb3302993692cff74603a4c607 # JavaScript generation
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          language: javascript
          package-name: gcom
          spec-path: openapi.yaml
          modify-spec-script: .github/workflows/modify-spec.sh
          commit-changes: "false"

      - name: Generate JavaScript KG Write Client
        uses: grafana/shared-workflows/actions/generate-openapi-clients@f3f00a8f0a28e0cb3302993692cff74603a4c607 # JavaScript generation
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          language: javascript
          package-name: kgwrite
          spec-path: kg-write-openapi.yaml
          modify-spec-script: .github/workflows/modify-spec.sh
          commit-changes: "false"

      - name: Generate JavaScript System Schema Client
        uses: grafana/shared-workflows/actions/generate-openapi-clients@f3f00a8f0a28e0cb3302993692cff74603a4c607 # JavaScript generation
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          language: javascript
          package-name: systemschema
          spec-path: system-schema-openapi.yaml
          modify-spec-script: .github/workflows/modify-spec.sh
          commit-changes: "false"

      - name: Test JavaScript clients
        run: node --test tests/js/*.test.cjs

      # Commit via the GitHub API so the commit is signed/verified, satisfying
      # the "Signed Commits" ruleset (a plain git push of a bot commit is not).
      # Skipped on fork PRs: GITHUB_TOKEN is read-only there, so the commit
      # would fail — generation above still runs and validates the spec.
      - name: Commit generated clients (signed)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          # No [skip ci]: it was always redundant. Commits created with the
          # workflow's GITHUB_TOKEN never trigger workflow runs, regardless of
          # message. Caveat: when this step commits on a PR, that commit becomes
          # the PR head with no runs on it, so ruleset-required checks
          # (trufflehog, zizmor) sit "expected" until another push — regenerate
          # locally before pushing spec changes, or push a follow-up commit.
          COMMIT_MESSAGE: "Update generated clients"
        run: .github/workflows/commit-signed-changes.sh
